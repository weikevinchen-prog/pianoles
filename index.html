<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Pianoles: leer (opnieuw) piano spelen met je digitale piano via MIDI.">
<title>Pianoles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <a class="iconbtn" id="back" href="#/" aria-label="Terug" hidden>‹</a>
  <h1 id="title">Pianoles</h1>
  <a class="pill" id="midiPill" href="#/verbinden" aria-label="Pianoverbinding"><span class="dot"></span><span id="midiTxt">Zoeken…</span></a>
</header>
<main id="app" tabindex="-1"></main>
<div class="rotate-hint" aria-hidden="true">↻ Draai je toestel voor een groter klavier</div>
<noscript><p style="padding:20px">Pianoles heeft JavaScript nodig.</p></noscript>
<script type="module" src="js/main.js"></script>
<script>
// Starten de modules niet (bv. geopend via file://), toon dan uitleg in plaats van een leeg scherm.
setTimeout(function () {
  if (window.pianoles) return;
  var file = location.protocol === 'file:';
  document.getElementById('app').innerHTML = '<div class="page"><div class="card"><h2>De app start niet</h2><p>' +
    (file ? 'Je opende het bestand rechtstreeks. Start een lokale webserver in deze map (<code>python -m http.server 8000</code>) en surf naar <code>http://localhost:8000</code>.'
          : 'Je browser is misschien te oud (ES-modules nodig). Probeer de nieuwste Chrome, Edge of Web MIDI Browser.') + '</p></div></div>';
}, 3000);
</script>
</body>
</html>
